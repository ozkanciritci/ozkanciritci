<svg
  width="1000"
  height="260"
  viewBox="0 0 1000 260"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Main title gradient -->
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft blur -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Side fade -->
    <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rightFade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip side animation areas -->
    <clipPath id="leftArea">
      <rect x="0" y="0" width="230" height="260"/>
    </clipPath>

    <clipPath id="rightArea">
      <rect x="770" y="0" width="230" height="260"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect
    x="0"
    y="0"
    width="1000"
    height="260"
    rx="16"
    fill="url(#bg)"
  />

  <!-- Subtle grid -->
  <g opacity="0.07" stroke="#8b949e" stroke-width="1">
    <line x1="0" y1="52" x2="1000" y2="52"/>
    <line x1="0" y1="104" x2="1000" y2="104"/>
    <line x1="0" y1="156" x2="1000" y2="156"/>
    <line x1="0" y1="208" x2="1000" y2="208"/>

    <line x1="100" y1="0" x2="100" y2="260"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="300" y1="0" x2="300" y2="260"/>
    <line x1="400" y1="0" x2="400" y2="260"/>
    <line x1="500" y1="0" x2="500" y2="260"/>
    <line x1="600" y1="0" x2="600" y2="260"/>
    <line x1="700" y1="0" x2="700" y2="260"/>
    <line x1="800" y1="0" x2="800" y2="260"/>
    <line x1="900" y1="0" x2="900" y2="260"/>
  </g>

  <!-- LEFT CODE RAIN -->
  <g
    clip-path="url(#leftArea)"
    font-family="monospace"
    font-size="14"
    fill="#58a6ff"
  >
    <g opacity="0.55">
      <text x="22" y="-80">
        01
        <animate
          attributeName="y"
          from="-80"
          to="340"
          dur="6s"
          repeatCount="indefinite"
        />
      </text>

      <text x="52" y="-150" opacity="0.5">
        {}
        <animate
          attributeName="y"
          from="-150"
          to="330"
          dur="8s"
          repeatCount="indefinite"
        />
      </text>

      <text x="92" y="-40" opacity="0.75">
        &lt;/&gt;
        <animate
          attributeName="y"
          from="-40"
          to="320"
          dur="7s"
          repeatCount="indefinite"
        />
      </text>

      <text x="145" y="-200" opacity="0.45">
        async
        <animate
          attributeName="y"
          from="-200"
          to="320"
          dur="10s"
          repeatCount="indefinite"
        />
      </text>

      <text x="32" y="-300" opacity="0.45">
        API
        <animate
          attributeName="y"
          from="-300"
          to="310"
          dur="11s"
          repeatCount="indefinite"
        />
      </text>

      <text x="115" y="-260" opacity="0.65">
        SQL
        <animate
          attributeName="y"
          from="-260"
          to="310"
          dur="9s"
          repeatCount="indefinite"
        />
      </text>

      <text x="180" y="-100" opacity="0.35">
        101
        <animate
          attributeName="y"
          from="-100"
          to="330"
          dur="6.5s"
          repeatCount="indefinite"
        />
      </text>

      <text x="65" y="-400" opacity="0.4">
        git
        <animate
          attributeName="y"
          from="-400"
          to="310"
          dur="12s"
          repeatCount="indefinite"
        />
      </text>
    </g>
  </g>

  <!-- RIGHT CODE RAIN -->
  <g
    clip-path="url(#rightArea)"
    font-family="monospace"
    font-size="14"
    fill="#58a6ff"
  >
    <g opacity="0.55">
      <text x="805" y="-100">
        01
        <animate
          attributeName="y"
          from="-100"
          to="330"
          dur="7s"
          repeatCount="indefinite"
        />
      </text>

      <text x="855" y="-220" opacity="0.55">
        {}
        <animate
          attributeName="y"
          from="-220"
          to="330"
          dur="9s"
          repeatCount="indefinite"
        />
      </text>

      <text x="915" y="-60" opacity="0.7">
        &lt;/&gt;
        <animate
          attributeName="y"
          from="-60"
          to="330"
          dur="7.5s"
          repeatCount="indefinite"
        />
      </text>

      <text x="790" y="-330" opacity="0.4">
        docker
        <animate
          attributeName="y"
          from="-330"
          to="320"
          dur="12s"
          repeatCount="indefinite"
        />
      </text>

      <text x="880" y="-380" opacity="0.5">
        cloud
        <animate
          attributeName="y"
          from="-380"
          to="320"
          dur="11s"
          repeatCount="indefinite"
        />
      </text>

      <text x="940" y="-250" opacity="0.5">
        API
        <animate
          attributeName="y"
          from="-250"
          to="320"
          dur="10s"
          repeatCount="indefinite"
        />
      </text>

      <text x="830" y="-470" opacity="0.35">
        101
        <animate
          attributeName="y"
          from="-470"
          to="310"
          dur="13s"
          repeatCount="indefinite"
        />
      </text>
    </g>
  </g>

  <!-- Side lighting -->
  <rect
    x="0"
    y="0"
    width="180"
    height="260"
    fill="url(#leftFade)"
    opacity="0.05"
  />

  <rect
    x="820"
    y="0"
    width="180"
    height="260"
    fill="url(#rightFade)"
    opacity="0.05"
  />

  <!-- Decorative left line -->
  <line
    x1="245"
    y1="72"
    x2="245"
    y2="188"
    stroke="#30363d"
    stroke-width="1"
  />

  <!-- Decorative right line -->
  <line
    x1="755"
    y1="72"
    x2="755"
    y2="188"
    stroke="#30363d"
    stroke-width="1"
  />

  <!-- Small engineering marks -->
  <circle cx="245" cy="72" r="3" fill="#58a6ff"/>
  <circle cx="245" cy="188" r="3" fill="#58a6ff"/>

  <circle cx="755" cy="72" r="3" fill="#58a6ff"/>
  <circle cx="755" cy="188" r="3" fill="#58a6ff"/>

  <!-- Main title -->
  <text
    x="500"
    y="112"
    text-anchor="middle"
    fill="url(#titleGradient)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="2"
  >
    OZKAN CIRITCI
  </text>

  <!-- Subtitle -->
  <text
    x="500"
    y="150"
    text-anchor="middle"
    fill="#c9d1d9"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="500"
    letter-spacing="1.5"
  >
    SOFTWARE ENGINEER
  </text>

  <!-- Areas -->
  <text
    x="500"
    y="181"
    text-anchor="middle"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    letter-spacing="1.5"
  >
    BACKEND  •  CLOUD  •  SYSTEMS
  </text>

  <!-- Bottom accent -->
  <rect
    x="410"
    y="207"
    width="180"
    height="2"
    rx="1"
    fill="#58a6ff"
    opacity="0.7"
  >
    <animate
      attributeName="width"
      values="80;180;80"
      dur="4s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="x"
      values="460;410;460"
      dur="4s"
      repeatCount="indefinite"
    />
  </rect>
</svg>
