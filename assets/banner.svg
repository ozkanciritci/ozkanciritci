<svg
  width="1000"
  height="280"
  viewBox="0 0 1000 280"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050805"/>
      <stop offset="45%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#071008"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9ffe2"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="leftArea">
      <rect x="0" y="0" width="250" height="280"/>
    </clipPath>

    <clipPath id="rightArea">
      <rect x="750" y="0" width="250" height="280"/>
    </clipPath>

    <radialGradient id="centerGlow">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect
    width="1000"
    height="280"
    rx="18"
    fill="url(#bg)"
  />

  <!-- Center subtle glow -->
  <ellipse
    cx="500"
    cy="135"
    rx="330"
    ry="120"
    fill="url(#centerGlow)"
  />

  <!-- Grid -->
  <g
    stroke="#00ff88"
    stroke-width="1"
    opacity="0.05"
  >
    <line x1="0" y1="40" x2="1000" y2="40"/>
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>

    <line x1="80" y1="0" x2="80" y2="280"/>
    <line x1="160" y1="0" x2="160" y2="280"/>
    <line x1="240" y1="0" x2="240" y2="280"/>
    <line x1="320" y1="0" x2="320" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="480" y1="0" x2="480" y2="280"/>
    <line x1="560" y1="0" x2="560" y2="280"/>
    <line x1="640" y1="0" x2="640" y2="280"/>
    <line x1="720" y1="0" x2="720" y2="280"/>
    <line x1="800" y1="0" x2="800" y2="280"/>
    <line x1="880" y1="0" x2="880" y2="280"/>
    <line x1="960" y1="0" x2="960" y2="280"/>
  </g>

  <!-- LEFT CODE RAIN -->
  <g
    clip-path="url(#leftArea)"
    font-family="JetBrains Mono, monospace"
    font-size="13"
    fill="#00ff88"
    filter="url(#greenGlow)"
  >

    <text x="12" y="-60" opacity="0.85">
      010101
      <animate attributeName="y" from="-60" to="340" dur="5.2s" repeatCount="indefinite"/>
    </text>

    <text x="45" y="-160" opacity="0.6">
      async
      <animate attributeName="y" from="-160" to="340" dur="7.5s" repeatCount="indefinite"/>
    </text>

    <text x="90" y="-20" opacity="0.8">
      {}
      <animate attributeName="y" from="-20" to="330" dur="5.8s" repeatCount="indefinite"/>
    </text>

    <text x="125" y="-240" opacity="0.55">
      SELECT
      <animate attributeName="y" from="-240" to="340" dur="8.5s" repeatCount="indefinite"/>
    </text>

    <text x="185" y="-100" opacity="0.8">
      &lt;/&gt;
      <animate attributeName="y" from="-100" to="330" dur="6.2s" repeatCount="indefinite"/>
    </text>

    <text x="215" y="-300" opacity="0.5">
      API
      <animate attributeName="y" from="-300" to="330" dur="9s" repeatCount="indefinite"/>
    </text>

    <text x="18" y="-420" opacity="0.5">
      POST
      <animate attributeName="y" from="-420" to="340" dur="10s" repeatCount="indefinite"/>
    </text>

    <text x="70" y="-360" opacity="0.65">
      python
      <animate attributeName="y" from="-360" to="330" dur="9.3s" repeatCount="indefinite"/>
    </text>

    <text x="135" y="-480" opacity="0.55">
      docker
      <animate attributeName="y" from="-480" to="340" dur="11s" repeatCount="indefinite"/>
    </text>

    <text x="195" y="-420" opacity="0.75">
      git
      <animate attributeName="y" from="-420" to="330" dur="8.8s" repeatCount="indefinite"/>
    </text>

    <text x="28" y="-560" opacity="0.7">
      0xFF
      <animate attributeName="y" from="-560" to="340" dur="11.5s" repeatCount="indefinite"/>
    </text>

    <text x="100" y="-650" opacity="0.45">
      cloud
      <animate attributeName="y" from="-650" to="330" dur="13s" repeatCount="indefinite"/>
    </text>

    <text x="165" y="-590" opacity="0.65">
      JSON
      <animate attributeName="y" from="-590" to="340" dur="12s" repeatCount="indefinite"/>
    </text>

    <text x="220" y="-680" opacity="0.5">
      1010
      <animate attributeName="y" from="-680" to="340" dur="12.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- RIGHT CODE RAIN -->
  <g
    clip-path="url(#rightArea)"
    font-family="JetBrains Mono, monospace"
    font-size="13"
    fill="#00ff88"
    filter="url(#greenGlow)"
  >

    <text x="760" y="-80" opacity="0.8">
      110011
      <animate attributeName="y" from="-80" to="340" dur="5.5s" repeatCount="indefinite"/>
    </text>

    <text x="805" y="-220" opacity="0.6">
      await
      <animate attributeName="y" from="-220" to="340" dur="7.4s" repeatCount="indefinite"/>
    </text>

    <text x="855" y="-50" opacity="0.85">
      []
      <animate attributeName="y" from="-50" to="330" dur="6s" repeatCount="indefinite"/>
    </text>

    <text x="895" y="-300" opacity="0.55">
      INSERT
      <animate attributeName="y" from="-300" to="340" dur="9.2s" repeatCount="indefinite"/>
    </text>

    <text x="945" y="-110" opacity="0.8">
      =&gt;
      <animate attributeName="y" from="-110" to="330" dur="6.4s" repeatCount="indefinite"/>
    </text>

    <text x="780" y="-420" opacity="0.55">
      REST
      <animate attributeName="y" from="-420" to="340" dur="10.4s" repeatCount="indefinite"/>
    </text>

    <text x="830" y="-360" opacity="0.7">
      django
      <animate attributeName="y" from="-360" to="330" dur="9s" repeatCount="indefinite"/>
    </text>

    <text x="885" y="-480" opacity="0.55">
      SQL
      <animate attributeName="y" from="-480" to="340" dur="11.2s" repeatCount="indefinite"/>
    </text>

    <text x="930" y="-440" opacity="0.8">
      API
      <animate attributeName="y" from="-440" to="330" dur="9.8s" repeatCount="indefinite"/>
    </text>

    <text x="770" y="-560" opacity="0.65">
      WebSocket
      <animate attributeName="y" from="-560" to="340" dur="12.2s" repeatCount="indefinite"/>
    </text>

    <text x="850" y="-650" opacity="0.45">
      Linux
      <animate attributeName="y" from="-650" to="330" dur="13.5s" repeatCount="indefinite"/>
    </text>

    <text x="900" y="-600" opacity="0.65">
      commit
      <animate attributeName="y" from="-600" to="340" dur="12.3s" repeatCount="indefinite"/>
    </text>

    <text x="950" y="-720" opacity="0.5">
      0110
      <animate attributeName="y" from="-720" to="340" dur="14s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Side separators -->
  <line
    x1="260"
    y1="55"
    x2="260"
    y2="220"
    stroke="#00ff88"
    stroke-opacity="0.25"
  />

  <line
    x1="740"
    y1="55"
    x2="740"
    y2="220"
    stroke="#00ff88"
    stroke-opacity="0.25"
  />

  <!-- Moving scanner lines -->
  <rect
    x="0"
    y="0"
    width="250"
    height="2"
    fill="#00ff88"
    opacity="0.35"
  >
    <animate
      attributeName="y"
      values="0;280;0"
      dur="7s"
      repeatCount="indefinite"
    />
  </rect>

  <rect
    x="750"
    y="280"
    width="250"
    height="2"
    fill="#00ff88"
    opacity="0.35"
  >
    <animate
      attributeName="y"
      values="280;0;280"
      dur="8s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Main title -->
  <text
    x="500"
    y="120"
    text-anchor="middle"
    fill="url(#titleGradient)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="54"
    font-weight="700"
    letter-spacing="2"
    filter="url(#titleGlow)"
  >
    OZKAN CIRITCI
  </text>

  <!-- Subtitle -->
  <text
    x="500"
    y="160"
    text-anchor="middle"
    fill="#d0d7de"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    letter-spacing="1.8"
  >
    SOFTWARE ENGINEER
  </text>

  <text
    x="500"
    y="192"
    text-anchor="middle"
    fill="#7ee787"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="600"
    letter-spacing="2"
  >
    BACKEND • CLOUD • SYSTEMS
  </text>

  <!-- Accent bar -->
  <rect
    x="420"
    y="218"
    width="160"
    height="2"
    rx="1"
    fill="#00ff88"
    filter="url(#greenGlow)"
  >
    <animate
      attributeName="width"
      values="70;160;70"
      dur="3.5s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="x"
      values="465;420;465"
      dur="3.5s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Corner details -->
  <g
    stroke="#00ff88"
    stroke-width="1.5"
    opacity="0.5"
  >
    <path d="M18 40 V18 H40"/>
    <path d="M960 18 H982 V40"/>
    <path d="M18 240 V262 H40"/>
    <path d="M960 262 H982 V240"/>
  </g>

  <!-- Status -->
  <circle
    cx="500"
    cy="247"
    r="4"
    fill="#00ff88"
    filter="url(#greenGlow)"
  >
    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="1.8s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="512"
    y="251"
    fill="#7ee787"
    font-family="JetBrains Mono, monospace"
    font-size="10"
    letter-spacing="1"
  >
    SYSTEM ONLINE
  </text>
</svg>
